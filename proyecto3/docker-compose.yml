services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: p3-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: p3user
      RABBITMQ_DEFAULT_PASS: p3localpass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    container_name: p3-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grpc-server:
    image: mumnk8s-grpc-server:local
    container_name: p3-grpc-server
    environment:
      RABBITMQ_URL: amqp://p3user:p3localpass@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "50051:50051"
    restart: unless-stopped

  consumer:
    image: mumnk8s-consumer:local
    container_name: p3-consumer
    environment:
      RABBITMQ_URL: amqp://p3user:p3localpass@rabbitmq:5672/
      VALKEY_ADDR: valkey:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  api-go:
    image: mumnk8s-api-go:local
    container_name: p3-api-go
    environment:
      GRPC_SERVER_ADDR: grpc-server:50051
      HTTP_ADDR: :8080
    depends_on:
      - grpc-server
    ports:
      - "8080:8080"
    restart: unless-stopped

  api-rust:
    image: mumnk8s-api-rust:local
    container_name: p3-api-rust
    environment:
      GO_API_URL: http://api-go:8080
      RUST_API_ADDR: 0.0.0.0:8000
    depends_on:
      - api-go
    ports:
      - "8000:8000"
    restart: unless-stopped

  metrics-exporter:
    image: mumnk8s-metrics-exporter:local
    container_name: p3-metrics-exporter
    environment:
      VALKEY_ADDR: valkey:6379
      METRICS_ADDR: :9100
      ASSIGNED_COUNTRY: ESP
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "9100:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: p3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - metrics-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: p3-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: p3grafana123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq_data:
  valkey_data:
  grafana_data:
  prometheus_data:
