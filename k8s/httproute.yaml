apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumnk8s-route
  namespace: mumnk8s
spec:
  parentRefs:
    - name: mumnk8s-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202503517
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api-rust
          port: 8000
